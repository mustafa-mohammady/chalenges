<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Forms and A11y</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <h1 class="title">Understanding A11y in Forms</h1>
    <p id="description">
      Please let us know how we can support you with a11y issues.
    </p>

    <form data-js="infoForm">
      <fieldset>
        <legend>Enter your information</legend>
        <label for="nameInput">Name:</label>
        <input
          type="text"
          name="name"
          id="nameInput"
          placeholder="Type your name.."
        />
        <label for="ageInput">Age:</label>
        <input
          type="text"
          name="age"
          id="ageInput"
          placeholder="Type your age.."
        />
        <label for="colorInput">Color you cannot see:</label>
        <input type="color" name="color" id="colorInput" />
        <label for="commentTextarea">Message:</label>
        <textarea
          rows="7"
          name="comment"
          id="commentTextarea"
          placeholder="Leave us a message..."
        ></textarea>
        <button type="submit">Submit</button>
      </fieldset>
    </form>
  </body>
  <script src="./js/script.js"></script>
</html>
